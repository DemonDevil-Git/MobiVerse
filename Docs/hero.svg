<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MobiVerse hero concept 03</title>
  <desc id="desc">A clean dashboard hero with a prominent reading preview and compact conversion status cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFC"/>
      <stop offset="0.52" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#F7F4EF"/>
    </linearGradient>
    <linearGradient id="button" x1="500" y1="462" x2="700" y2="462" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="shadow" x="72" y="66" width="1056" height="484" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#111827" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="640" rx="36" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="104" y="104" width="992" height="408" rx="32" fill="#FFFFFF"/>
    <rect x="132" y="132" width="258" height="352" rx="24" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="164" y="176" fill="#111827" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="800">Read-first</text>
    <text x="164" y="204" fill="#64748B" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Open or convert</text>
    <text x="164" y="224" fill="#64748B" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">with one gesture.</text>
    <rect x="164" y="250" width="194" height="54" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="188" cy="277" r="9" fill="#16A34A"/>
    <text x="210" y="274" fill="#111827" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13.5" font-weight="800">EPUB opens</text>
    <text x="210" y="291" fill="#64748B" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12.5">instantly</text>
    <rect x="164" y="320" width="194" height="54" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="188" cy="347" r="9" fill="#2563EB"/>
    <text x="210" y="344" fill="#111827" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13.5" font-weight="800">MOBI converts</text>
    <text x="210" y="361" fill="#64748B" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12.5">silently</text>
    <rect x="164" y="390" width="194" height="54" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="188" cy="417" r="9" fill="#B45309"/>
    <text x="210" y="414" fill="#111827" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13.5" font-weight="800">Comics stay</text>
    <text x="210" y="431" fill="#64748B" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12.5">centered</text>

    <rect x="470" y="132" width="260" height="284" rx="30" fill="#111827"/>
    <rect x="502" y="164" width="196" height="188" rx="16" fill="#F5EBD8"/>
    <rect x="530" y="195" width="140" height="54" rx="4" fill="#111827"/>
    <rect x="530" y="266" width="140" height="34" rx="4" fill="#111827"/>
    <rect x="530" y="314" width="140" height="24" rx="4" fill="#111827"/>
    <circle cx="600" cy="392" r="8" fill="#CBD5E1"/>
    <rect x="500" y="440" width="200" height="44" rx="22" fill="url(#button)"/>
    <text x="600" y="459" text-anchor="middle" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13.5" font-weight="800">Preview after</text>
    <text x="600" y="476" text-anchor="middle" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13.5" font-weight="800">conversion</text>

    <rect x="810" y="132" width="254" height="352" rx="24" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="842" y="176" fill="#111827" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="800">MobiVerse</text>
    <text x="842" y="204" fill="#64748B" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Polished EPUB output</text>
    <text x="842" y="224" fill="#64748B" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">for illustrated reading.</text>
    <rect x="842" y="254" width="190" height="10" rx="5" fill="#D1E9FF"/>
    <rect x="842" y="254" width="144" height="10" rx="5" fill="#2563EB"/>
    <text x="842" y="298" fill="#111827" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="800">Converting to EPUB</text>
    <text x="842" y="326" fill="#64748B" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Stable image pages</text>
    <text x="842" y="352" fill="#64748B" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Cover metadata</text>
    <text x="842" y="378" fill="#64748B" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Local processing</text>
    <path d="M758 314h36" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <path d="M779 300l17 14-17 14" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M406 314h36" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <path d="M427 300l17 14-17 14" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="600" y="584" text-anchor="middle" fill="#334155" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="800">Convert, preview, and keep reading without leaving the app.</text>
</svg>
