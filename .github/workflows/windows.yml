name: Windows

on:
  push:
    paths: ['Windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', '.github/workflows/windows.yml']

jobs:
  build-and-test:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore MobiVerse.sln
      - run: dotnet test MobiVerse.sln --configuration Release --no-restore
      - run: dotnet build src/MobiVerse.App/MobiVerse.App.csproj --configuration Release --no-restore
